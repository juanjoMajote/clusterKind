kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
    - containerPort: 30080
      hostPort: 30080
      protocol: TCP
    - containerPort: 31002
      hostPort: 31002
      protocol: TCP
    - containerPort: 31000
      hostPort: 31000
      protocol: TCP
    - containerPort: 32140
      hostPort: 32140
      protocol: TCP
    - containerPort: 31001
      hostPort: 31001
      protocol: TCP
  - role: worker
